import java.nio.file.Files
import java.nio.file.StandardCopyOption

tasks.register('config') {
    group = 'koke'
    description = 'Create module profiles. Requires -Pmodule=<Name>[@<Version>].'
    def profiles = new File(rootDir, 'profile')
    def identifier = findProperty('module') as String
    doLast {
        if (!identifier) throw new GradleException(':config requires -Pmodule=<Name>[@<Version>]')
        def module = identifier.split('@', 2).first()
        [module, identifier].unique().each { name ->
            def profile = new File(profiles, "${name}.gradle")
            if (profile.exists()) return
            profile.parentFile.mkdirs()
            profile.text = name == module ? "// ${module}: base profile.\n" : "// ${name}: version overrides.\n"
            println "+ ${profile}"
        }
    }
}

tasks.register('make') {
    group = 'koke'
    description = 'Prepare and link instances. -Pmodule=<Name>[@<Version>] for one, omit for all modules.'
    def repo = rootDir
    def profiles = new File(repo, 'profile')
    def seed = new File(repo, 'seed')
    def identifier = findProperty('module') as String
    def targets = identifier ? [identifier] : fileTree(profiles) {
        include '*.gradle'
        exclude '*@*.gradle'
    }.files.collect { it.name - '.gradle' }.sort()
    def excludes = ['.idea', '.gradle', 'build']
    def arguments = ['--console=plain', '--warn', 'link'] + (gradle.startParameter.offline ? ['--offline'] : [])

    doLast {
        targets.each { name ->
            def instance = new File(repo, "modules/${name}")
            def module = name.split('@', 2).first()
            def required = [module, name].unique().collect { new File(profiles, "${it}.gradle") }
            def missing = required.findAll { !it.isFile() }
            if (missing) throw new GradleException("module profile missing: ${missing*.path.join(', ')}\n  run :config -Pmodule=${name} first")
            if (!instance.exists()) {
                println "+ cp -R seed modules/${name}"
                Files.walk(seed.toPath()).withCloseable { paths ->
                    paths.forEach { source ->
                        def relative = seed.toPath().relativize(source)
                        if (relative.nameCount > 0 && excludes.contains(relative.getName(0).toString())) return
                        def target = instance.toPath().resolve(relative)
                        if (Files.isDirectory(source)) Files.createDirectories(target)
                        else Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING)
                    }
                }
                new File(instance, 'gradlew').setExecutable(true, false)
                new File(instance, 'externals').mkdirs()
            }
            def process = new ProcessBuilder([new File(instance, 'gradlew').path] + arguments)
                .directory(instance).redirectErrorStream(true).start()
            process.inputStream.withReader { output -> output.eachLine { println it } }
            if (process.waitFor() != 0) throw new GradleException("could not prepare ${name}; see the instance output above")
        }
    }
}
